        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }

        :root {
            --color-blue-primary: #00B0F0;
            --color-blue-light: #E0F5FF;
            --color-blue-dark: #008BC0;
            --color-focus-blue: #005C8C;
            --color-focus-blue-light: #C0E9FF;
            --node-spacing: 24px;
        }

        .option-button {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            color: white;
            background-color: var(--color-blue-primary);
        }

        .option-button:hover {
            background-color: var(--color-blue-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .result-card {
            background-color: var(--color-blue-light);
            border-left: 5px solid var(--color-blue-primary);
        }

        .node-container {
            position: relative;
            margin-left: var(--node-spacing);
            padding-left: 2px;
        }

        .root-node {
            margin-left: 0;
            padding-left: 0;
        }

        .completed-card {
            background-color: #f0f4f8;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 15px;
            margin-bottom: 5px;
            position: relative;
        }

        .completed-card .selection-text {
            color: var(--color-focus-blue);
        }

        .active-card {
            background-color: #fff;
            border: 2px solid var(--color-focus-blue);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 92, 140, 0.2);
            padding: 1.5rem;
            margin-top: 15px;
            position: relative;
        }

        .active-card .question-box {
            background-color: var(--color-focus-blue-light);
            border-left: 4px solid var(--color-focus-blue);
        }

        .active-card .question-box p {
            color: var(--color-focus-blue);
        }

        .back-button {
            color: var(--color-focus-blue);
        }

        .back-button:hover {
            color: var(--color-blue-dark);
        }

        .completed-card .selection-text svg {
            color: var(--color-focus-blue);
        }

        .result-card .final-selection-text {
            color: var(--color-blue-primary);
        }

        details>summary {
            list-style: none;
        }

        details>summary::-webkit-details-marker {
            display: none;
        }

        details[open] summary~* {
            animation: sweep .3s ease-in-out;
        }

        @keyframes sweep {
            0% {
                opacity: 0;
                transform: translateY(-10px)
            }

            100% {
                opacity: 1;
                transform: translateY(0)
            }
        }

        details[open] .accordion-arrow {
            transform: rotate(180deg);
        }

        .custom-accordion {
            background-color: white;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
        }

        .custom-accordion summary {
            color: var(--color-focus-blue);
            font-weight: 600;
        }

        .custom-accordion:hover {
            border-color: var(--color-blue-primary);
        }
    </style>
</head>

        function resolverRutaImagen(nombreArchivo) {
            if (!nombreArchivo) return '';

            if (nombreArchivo.startsWith('http') || nombreArchivo.startsWith('https')) {
                return nombreArchivo;
            }

            let nombreLimpio = nombreArchivo.trim();

            if (nombreLimpio.endsWith('.')) {
                nombreLimpio = nombreLimpio.slice(0, -1);
            }

            let nombreConExtension = nombreLimpio;
            if (!nombreLimpio.toLowerCase().endsWith('.png') &&
                !nombreLimpio.toLowerCase().endsWith('.jpg') &&
                !nombreLimpio.toLowerCase().endsWith('.jpeg')) {
                nombreConExtension = nombreLimpio + ".png";
            }

            return RUTA_IMAGENES + encodeURIComponent(nombreConExtension);

            { ambito: 'RURAL DISPERSO', documento: 'Situación del marco para la seguridad del agua de consumo humano en América Latina y el Caribe', enlace: 'https://iris.paho.org/bitstream/handle/10665.2/55388/9789275324554_spa.pdf?sequence=1&isAllowed=y' },
            { ambito: 'RURAL DISPERSO', documento: 'Metodología de los diálogos de saberes', enlace: 'https://iris.paho.org/handle/10665.2/55670' },
            { ambito: 'RURAL DISPERSO', documento: 'Orientaciones para la elaboración de perfiles de situación de enfermedades transmisibles en el marco de los progresos hacia su eliminación en la Región de las Américas', enlace: 'https://iris.paho.org/bitstream/handle/10665.2/58085/9789275326596_spa.pdf?sequence=1&isAllowed=y' },
            { ambito: 'RURAL DISPERSO', documento: 'Guías para el diseño de estaciones de bombeo de agua potable', enlace: 'https://iris.paho.org/bitstream/handle/10665.2/55454/OPSCEPIS05161_spa.pdf?sequence=1&isAllowed=y' },
            { ambito: 'RURAL DISPERSO', documento: 'Curso Virtual: Planes de Seguridad del Agua Resilientes al Clima', enlace: 'https://campus.paho.org/es/curso/planes-seguridad-agua-resilientes-al-clima' },
            { ambito: 'RURAL DISPERSO', documento: 'Guías para la operación y mantenimiento de reservorios elevados y estaciones de bombeo', enlace: 'https://iris.paho.org/bitstream/handle/10665.2/55380/OPSCEPIS05159_spa.pdf?sequence=1&isAllowed=y' },
            { ambito: 'RURAL DISPERSO', documento: 'Curso Virtual: Agua, saneamiento e higiene (WASH) y salud: trabajando juntos', enlace: 'https://campus.paho.org/es/curso/agua-saneamiento-e-higiene-wash' },
            { ambito: 'RURAL DISPERSO', documento: 'Metodología WASHFIT: Evalucación del Agua, Saneamiento e Higiene en Establecimientos de Salud', enlace: 'https://www.washinhcf.org/wash-fit-espanol/' },
            { ambito: 'RURAL DISPERSO', documento: 'Tecnologías de saneamiento básico y avanzado, y gestión de aguas pluviales convencionales y no convencionales para poblaciones rurales o periURBANOs', enlace: 'https://drive.google.com/file/d/1sdRM2VBHMX5Xto4J4VTsLtWIBB2b4eR9/view?usp=drive_link' },
            { ambito: 'RURAL DISPERSO', documento: 'Guías para la calidad del agua de consumo humano para pequeños sistemas de abastecimiento de agua', enlace: 'https://drive.google.com/file/d/10NWIIxipyryLaN1cWcwy6J48sVVDO5J2/view?usp=drive_link' },
        ];

        const container = document.getElementById('decision-container');
        const restartButton = document.getElementById('restart-button');
        const toolsBox = document.getElementById('tools-box');

        let currentPath = [];

        // --- LÓGICA DE BÚSQUEDA Y CRUCE NORMALIZADO ---
        function normalizarTexto(txt) {
            return (txt || '').replace(/[\/\s]+/g, ' ').trim().toLowerCase();
        }

        function buscarResultados(caminoUsuario) {
            if (caminoUsuario.length < 5) return [];

            const ambito = normalizarTexto(caminoUsuario[0].selection);
            const disponibilidad = normalizarTexto(caminoUsuario[1].selection);
            const fuente = normalizarTexto(caminoUsuario[2].selection);
            const abastecimiento = normalizarTexto(caminoUsuario[3].selection);
            const distribucion = normalizarTexto(caminoUsuario[4].selection);

            const regla = reglasAgua.find(r => 
                normalizarTexto(r.ambito) === ambito &&
                normalizarTexto(r.disponibilidad) === disponibilidad &&
                normalizarTexto(r.fuente) === fuente &&
                normalizarTexto(r.abastecimiento) === abastecimiento &&
                normalizarTexto(r.distribucion) === distribucion
            );

            if (!regla || !regla.recomendaciones) return [];

            const resultados = [];
            regla.recomendaciones.forEach(rec => {
                rec.techs.forEach(techId => {
                    const dataFicha = catalogoTecnologias[techId];
                    if (dataFicha) {
                        resultados.push({
                            categoria: rec.categoria,
                            titulo: dataFicha.titulo,
                            img: dataFicha.img,
                            link: dataFicha.link
                        });
                    }
                });
            });

            return resultados;
        }

        function agruparPorCategoria(items) {
            const grupos = {};
            items.forEach(item => {
                const cat = item.categoria || "Otras Tecnologías";
                if (!grupos[cat]) {
                    grupos[cat] = [];
                }
                grupos[cat].push(item);
            });
            return grupos;
        }

        // --- RENDERIZADO DEL ÁRBOL ---
        function renderNode(index, parentNode) {
            const pathItem = currentPath[index];
            const isRoot = index === 0;

            const nodeContainer = document.createElement('div');
            nodeContainer.className = `node-container ${isRoot ? 'root-node' : ''}`;
            parentNode.appendChild(nodeContainer);

            const completedCard = document.createElement('div');
            completedCard.className = 'completed-card w-full shadow-md';
            completedCard.innerHTML = `
                <p class="text-sm font-bold text-gray-600">${pathItem.question}</p>
                <p class="text-lg font-extrabold mt-1 flex items-center selection-text">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    ${pathItem.selection}
                </p>
            `;
            nodeContainer.appendChild(completedCard);

            if (index + 1 < currentPath.length) {
                renderNode(index + 1, nodeContainer);
            } else {
                const currentStepData = pathItem.nextStep;
                if (currentStepData.final === true) {
                    displayResult(nodeContainer);
                } else {
                    renderActiveStep(currentStepData, nodeContainer);
                }
            }
        }

        function renderPath() {
            container.innerHTML = '';
            restartButton.classList.add('hidden');
            toolsBox.classList.add('hidden');

            if (currentPath.length === 0) {
                renderActiveStep(decisionTree, container, true);
            } else {
                renderNode(0, container);
            }
        }

        function renderActiveStep(step, parentNode, isRoot = false) {
            const activeContainer = document.createElement('div');
            activeContainer.className = `node-container ${isRoot ? 'root-node' : ''}`;
            parentNode.appendChild(activeContainer);

            const activeCard = document.createElement('div');
            activeCard.className = 'active-card w-full transition-all duration-500';

            const backButtonHtml = isRoot ? '' : `
                <button onclick="goBack()" class="group flex items-center px-5 py-2 mb-6 text-sm font-bold text-gray-600 transition-all duration-300 bg-white border-2 border-gray-100 rounded-full shadow-sm hover:border-blue-500 hover:text-blue-600 hover:shadow-md hover:-translate-y-0.5">
                    <div class="p-1 mr-2 transition-colors duration-300 bg-gray-100 rounded-full group-hover:bg-blue-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500 transition-colors duration-300 group-hover:text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </div>
                    <span>Volver al paso anterior</span>
                </button>
            `;

            activeCard.innerHTML = `
                ${backButtonHtml}
                <div class="mb-6 p-4 rounded-lg question-box">
                    <p class="text-xl font-bold">${step.question}</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="options-grid"></div>
            `;
            activeContainer.appendChild(activeCard);

            const optionsGrid = activeCard.querySelector('#options-grid');

            step.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option-button w-full px-5 py-3 text-white font-semibold rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-300 shadow-md transform transition hover:scale-[1.02] active:scale-95';
                button.textContent = option.label;
                button.onclick = () => handleSelection(option, step.question);
                optionsGrid.appendChild(button);
            });
        }

        function handleSelection(option, previousQuestion) {
            currentPath.push({
                question: previousQuestion,
                selection: option.label,
                nextStep: option.next || option
            });
            renderPath();
        }

        // --- RENDERIZADO DE RESULTADOS ---
        function displayResult(parentNode) {
            let resultadosEncontrados = buscarResultados(currentPath);

            if (resultadosEncontrados.length === 0) {
                resultadosEncontrados = [{
                    categoria: "Ficha Ficticia (Faltan Datos)",
                    titulo: "Tecnología No Registrada (Editar Base de Datos)",
                    img: "placeholder",
                    link: "#"
                }];
            }

            const grupos = agruparPorCategoria(resultadosEncontrados);

            const resultContainer = document.createElement('div');
            resultContainer.className = 'node-container mt-4';
            parentNode.appendChild(resultContainer);

            let htmlContent = '';

            for (const [categoria, items] of Object.entries(grupos)) {
                const cardsHtml = items.map(item => `
                    <a href="${item.link}" target="_blank" class="group block bg-gray-50 rounded-lg overflow-hidden border border-gray-200 hover:shadow-lg transition-all duration-200 hover:border-blue-400">
                        <div class="aspect-video w-full overflow-hidden relative bg-white border-b border-gray-100">
                            <img src="${resolverRutaImagen(item.img)}" alt="${item.titulo}" class="w-full h-full object-contain p-2 transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/600x400?text=Sin+Imagen'">
                        </div>
                        <div class="p-3">
                            <p class="text-sm font-bold text-blue-700 flex items-center justify-between leading-snug">
                                ${item.titulo}
                                <i data-lucide="external-link" class="w-3 h-3 flex-shrink-0 ml-2"></i>
                            </p>
                        </div>
                    </a>
                `).join('');

                htmlContent += `
                    <details class="custom-accordion mb-3 shadow-sm overflow-hidden transition-all open:shadow-md group">
                        <summary class="flex items-center justify-between cursor-pointer p-4 bg-white hover:bg-blue-50 transition-colors select-none">
                            <div class="flex items-center gap-3">
                                <span class="text-base font-semibold leading-tight" style="color: var(--color-focus-blue);">
                                    ${categoria}
                                </span>
                            </div>
                            <i data-lucide="chevron-down" class="accordion-arrow text-gray-400 w-5 h-5 transition-transform duration-300"></i>
                        </summary>
                        <div class="p-4 border-t border-gray-100 bg-slate-50">
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                ${cardsHtml}
                            </div>
                        </div>
                    </details>
                `;
            }

            const finalResultHtml = `
                <div class="result-card p-6 rounded-xl shadow-xl space-y-4 relative">
                    <p class="text-xl font-extrabold" style="color: var(--color-blue-dark);">
                        Tecnologías Recomendadas:
                    </p>
                    <div class="h-1 rounded w-full mb-4" style="background-color: var(--color-blue-primary);"></div> 
                    <div class="mt-4">
                        ${htmlContent}
                    </div>
                </div>
            `;

            resultContainer.innerHTML = finalResultHtml;
            restartButton.classList.remove('hidden');

            lucide.createIcons();

            if (currentPath.length > 0) {
                const ambitoSeleccionado = currentPath[0].selection.toUpperCase();
                renderToolsBox(ambitoSeleccionado);
            }
        }

        function renderToolsBox(ambito) {
            const filteredTools = toolsData.filter(tool => tool.ambito.toUpperCase() === ambito);
            if (filteredTools.length === 0) return;

            const toolsListHtml = filteredTools.map(tool => `
                <li class="p-3 bg-white rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition duration-150">
                    <a href="${tool.enlace}" target="_blank" class="text-sm font-medium flex items-start hover:text-blue-700" style="color: var(--color-blue-dark);">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mt-1 mr-2 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                        <span class="flex-grow">${tool.documento}</span>
                    </a>
                </li>
            `).join('');

            toolsBox.innerHTML = `
                <h2 class="text-2xl font-bold mb-4 pt-4 border-t" style="color: var(--color-focus-blue);">Herramientas y Recursos</h2>
                <p class="text-sm text-gray-600 mb-4">Los siguientes recursos están disponibles para el ámbito ${ambito.toLowerCase()}:</p>
                <ul class="space-y-3 p-4 bg-gray-50 rounded-lg border border-gray-100 shadow-inner">
                    ${toolsListHtml}
                </ul>
            `;
            toolsBox.classList.remove('hidden');
        }

        function goBack() {
            if (currentPath.length > 0) {
                currentPath.pop();
                renderPath();
            }
        }

        function restartDecision() {
            currentPath = [];
            toolsBox.classList.add('hidden');
            renderPath();
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarDatos();
        });
    </script>
</body>
</html>
